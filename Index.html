<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="siteTitle">Dedicated Official</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #000;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #111;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    button, a {
      cursor: pointer;
    }

    .admin-btn {
      background: white;
      color: black;
      padding: 10px 18px;
      border-radius: 8px;
      border: 0;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
    }

    .hero h1 {
      font-size: 60px;
    }

    .hero p {
      color: #aaa;
      margin-top: 20px;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      max-width: 700px;
      margin: 40px auto;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      background: white;
      color: black;
      padding: 15px 30px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    #adminPanel {
      display: none;
      background: #111;
      padding: 30px;
      margin: 30px auto;
      max-width: 500px;
      border-radius: 15px;
      text-align: center;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    .admin-action-btn {
      padding: 10px 20px;
      background: white;
      color: black;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" id="logo">Dedicated Official</div>
    <button class="admin-btn" onclick="openAdmin()">Admin</button>
  </header>

  <section class="hero">
    <h1 id="title">Dedicated Official</h1>
    <p id="description">Music • Videos • New Releases</p>
  </section>

  <div class="card">
    <h2>Latest Release</h2>
    <br>
    <h3 id="song">New Song</h3>
    <a class="button" id="youtube" href="#" target="_blank">Watch Now</a>
  </div>

  <div id="adminPanel">
    <div id="loginForm">
      <h2>Admin Login</h2>
      <input type="password" id="password" placeholder="Password">
      <br>
      <button class="admin-action-btn" onclick="login()">Login</button>
    </div>

    <div id="editor" style="display:none;">
      <h2>Edit Site</h2>
      <input id="newTitle" placeholder="Title">
      <input id="newDescription" placeholder="Description">
      <input id="newSong" placeholder="Song Name">
      <input id="newYoutube" placeholder="YouTube Link">
      <br>
      <button class="admin-action-btn" onclick="saveChanges()">Save</button>
    </div>
  </div>

  <footer>
    © 2026 Dedicated Official
  </footer>

  <script>
    const titleEl = document.getElementById('title');
    const logoEl = document.getElementById('logo');
    const descriptionEl = document.getElementById('description');
    const songEl = document.getElementById('song');
    const youtubeEl = document.getElementById('youtube');
    const adminPanel = document.getElementById('adminPanel');
    const loginForm = document.getElementById('loginForm');
    const editor = document.getElementById('editor');
    const passwordInput = document.getElementById('password');

    const newTitle = document.getElementById('newTitle');
    const newDescription = document.getElementById('newDescription');
    const newSong = document.getElementById('newSong');
    const newYoutube = document.getElementById('newYoutube');

    function loadSite() {
      const savedTitle = localStorage.getItem('title') || "Dedicated Official";
      titleEl.innerText = savedTitle;
      logoEl.innerText = savedTitle;
      document.title = savedTitle;

      descriptionEl.innerText = localStorage.getItem('description') || "Music • Videos • New Releases";
      songEl.innerText = localStorage.getItem('song') || "New Song";
      youtubeEl.href = localStorage.getItem('youtube') || "#";
    }

    function openAdmin() {
      adminPanel.style.display = adminPanel.style.display === "block" ? "none" : "block";
    }

    function login() {
      if (passwordInput.value === "HiCaT123") {
        loginForm.style.display = "none";
        editor.style.display = "block";

        newTitle.value = titleEl.innerText;
        newDescription.value = descriptionEl.innerText;
        newSong.value = songEl.innerText;
        newYoutube.value = youtubeEl.href;
      } else {
        alert("Wrong password");
      }
    }

    function saveChanges() {
      localStorage.setItem('title', newTitle.value);
      localStorage.setItem('description', newDescription.value);
      localStorage.setItem('song', newSong.value);
      localStorage.setItem('youtube', newYoutube.value);

      loadSite();
      alert("Saved!");
    }

    // Initialize site data on page load
    loadSite();
  </script>
</body>
  </html>
